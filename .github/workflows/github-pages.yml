name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'dev/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default; only the deploy job may publish to Pages.
permissions:
  contents: read

# Cancel superseded pull request runs, but never a deploy on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions/checkout runs `git init` before any step can configure Git; this
# silences its "default branch name" hint.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Lint the workflows themselves (actionlint also runs shellcheck on run: blocks).
  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  # Fast checks run before the tests and the build.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check file size limits
        run: npm run check:file-size

      - name: Check for secrets
        run: npm run check:secrets

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  test:
    needs: [lint-workflows, checks, network-browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # On pull requests this is the merge result with main, not the branch head.
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build the React app
        run: npm run build

      # Issue #11: every CV (position × style × language) is printed to PDF by
      # headless Chromium and checked: at most 2 pages for a position, 1 page
      # for the compact style, and a text layer an ATS can read.
      - name: Install Chromium for the CV PDFs
        run: npx playwright install --with-deps chromium

      - name: Print the CV PDFs
        run: npm run build:cv

      # GitHub Pages is set to deploy from GitHub Actions, so the site is
      # published from this artifact, not from a branch or the docs/ folder.
      # Pull requests upload it too, so a broken artifact fails before merge.
      - name: Upload the build as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/
          include-hidden-files: true

  network-browsers:
    needs: [lint-workflows, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the editor
        run: npm run build

      - name: Install the browser
        # package.json pins 1.63.0: 1.64.x's Linux WebKit stalls on glass panels.
        # https://github.com/microsoft/playwright/issues/43426
        run: npx playwright install --with-deps "$ENGINE"

      - name: Verify existing editor features and image downloads
        run: npm run test:network:browser
        env:
          CAPTURE_DIR: browser-results/screenshots/editor

      - name: Verify history, self loops, layouts, clipboard and mobile editing
        run: npm run test:network:issue19
        env:
          CAPTURE_DIR: browser-results/screenshots/issue19
          RESULT_DIR: browser-results/data/issue19

      - name: Verify editor geometry, source colors and shared settings
        run: npm run test:network:issue21
        env:
          CAPTURE_DIR: browser-results/screenshots/issue21
          RESULT_DIR: browser-results/data/issue21

      - name: Verify curved markers, per-link gaps and bounded gallery blur surfaces
        run: npm run test:network:issue23
        env:
          CAPTURE_DIR: browser-results/screenshots/issue23
          RESULT_DIR: browser-results/data/issue23

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-${{ matrix.engine }}
          path: browser-results/
          if-no-files-found: warn

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # A green deploy must mean the site is really there (issue #5).
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Verify the deployed site
        run: bash scripts/check-deployed-site.sh "$PAGE_URL"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
