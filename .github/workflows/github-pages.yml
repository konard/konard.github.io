name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

# Least-privilege default; only the deploy job may publish to Pages.
permissions:
  contents: read

# actions/checkout runs `git init` before any step can configure Git; this
# silences its "default branch name" hint.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  prepare:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-prepare
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout the merge result
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Verify merge freshness and detect changes
        id: changes
        run: node scripts/ci-changes.mjs
      - name: Check GitHub Pages configuration before building
        run: node scripts/check-pages.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_PAGES: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}

  # Lint the workflows themselves (actionlint also runs shellcheck on run: blocks).
  lint-workflows:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint-workflows
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  # Fast checks run before the tests and the build.
  checks:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-checks
      cancel-in-progress: true
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check file size limits
        run: npm run check:file-size

      - name: Check for secrets
        run: npm run check:secrets

      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=moderate

  test:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    needs: [prepare, lint-workflows, checks, network-browsers]
    if: needs.prepare.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # On pull requests this is the merge result with main, not the branch head.
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build the React app
        run: npm run build

      # Issue #11: every CV (position × style × language) is printed to PDF by
      # headless Chromium and checked: at most 2 pages for a position, 1 page
      # for the compact style, and a text layer an ATS can read.
      - name: Install Chromium for the CV PDFs
        run: npx playwright install --with-deps chromium

      - name: Print the CV PDFs
        run: npm run build:cv

      # GitHub Pages is set to deploy from GitHub Actions, so the site is
      # published from this artifact, not from a branch or the docs/ folder.
      # Pull requests upload it too, so a broken artifact fails before merge.
      - name: Upload the build as the Pages artifact with bounded transport retries
        uses: ./.github/actions/upload-artifact
        with:
          name: github-pages
          path: build/
          pages: 'true'

  network-browsers:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-network-browsers-${{ matrix.engine }}
      cancel-in-progress: true
    needs: [prepare, lint-workflows, checks, tooling]
    if: needs.prepare.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each limit leaves room for a busy runner: in one run of issue #45
          # every step took 1.3 to 1.5 times as long as usual (even checkout).
          # Chromium took 9 min on main and 11 min with the 18 extra settings
          # sliders and the step of issue #45; that busy run cut it at 15.
          - engine: chromium
            os: ubuntu-24.04
            timeout: 20
          - engine: firefox
            os: ubuntu-24.04
            timeout: 15
          # This container's Linux GTK renderer omits backdrop effects on
          # screen. Test WebKit on macOS, the platform used by the reported bug.
          # Pin Intel: ARM capacity left a previous job without any runner.
          # WebKit on this runner is the slowest: before issue #45 it already
          # took about 12 of 15 minutes. With the Matrix universe look as the
          # default (issue #45), a restyle of the settings page takes about
          # 380 ms instead of about 110 ms, so the issue #27 audit of its 111
          # sliders takes about 290 s instead of 100 s. The job took 16 min 45 s,
          # and 23 min 51 s on a busy runner.
          - engine: webkit
            os: macos-15-intel
            timeout: 30
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the editor
        run: npm run build

      - name: Install the browser
        id: browser
        # WebKit uses macOS because Linux GTK can stall on glass panels.
        # https://github.com/microsoft/playwright/issues/43426
        run: npx playwright install --with-deps "$ENGINE"

      - name: Initialize browser evidence
        run: |
          mkdir -p browser-results
          node -e 'require("node:fs").writeFileSync("browser-results/run.json", JSON.stringify({sha: process.env.GITHUB_SHA, engine: process.env.ENGINE}))'

      - name: Verify existing editor features and image downloads
        run: npm run test:network:browser
        env:
          CAPTURE_DIR: browser-results/screenshots/editor

      - name: Verify history, self loops, layouts, clipboard and mobile editing
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue19
        env:
          CAPTURE_DIR: browser-results/screenshots/issue19
          RESULT_DIR: browser-results/data/issue19

      - name: Verify editor geometry, source colors and shared settings
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue21
        env:
          CAPTURE_DIR: browser-results/screenshots/issue21
          RESULT_DIR: browser-results/data/issue21

      - name: Verify curved markers, per-link gaps and bounded gallery blur surfaces
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        # Capture the actual compositor, including Firefox backdrop effects.
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            DISPLAY_CAPTURE=1 npm run test:network:issue23
          else
            mkdir -p "$(dirname "$XWD_FILE")"
            xvfb-run -a -s "-screen 0 1600x1200x24 -fbdir $(dirname "$XWD_FILE")" npm run test:network:issue23
          fi
        env:
          CARD_BATCHES: '8' # The exact reported 4,131-card load, in every engine.
          XWD_FILE: ${{ runner.temp }}/issue23-display/Xvfb_screen0
          CAPTURE_DIR: browser-results/screenshots/issue23
          RESULT_DIR: browser-results/data/issue23

      - name: Verify automatic spacing, sharp balanced arrows and per-link cards
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue25
        env:
          CAPTURE_DIR: browser-results/screenshots/issue25
          RESULT_DIR: browser-results/data/issue25

      - name: Verify equal closed gaps, historical URLs and numeric keyboard controls
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue27
        env:
          CAPTURE_DIR: browser-results/screenshots/issue27
          RESULT_DIR: browser-results/data/issue27

      - name: Verify paired sliders, preserved manual layouts and symmetric automatic references
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue29
        env:
          CAPTURE_DIR: browser-results/screenshots/issue29
          RESULT_DIR: browser-results/data/issue29

      - name: Verify contribution calendar, code counts, social fallback and mobile layouts
        if: ${{ !cancelled() && matrix.engine == 'chromium' && steps.browser.outcome == 'success' }}
        run: npm run test:indicators:browser
        env:
          CAPTURE_DIR: browser-results/screenshots/issue33

      - name: Verify continuous middles and explicit cuts after automatic spacing
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue35
        env:
          CAPTURE_DIR: browser-results/screenshots/issue35
          RESULT_DIR: browser-results/data/issue35

      - name: Verify self crossings, 20 random networks, slider focus and worker responsiveness
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue37
        env:
          CAPTURE_DIR: browser-results/screenshots/issue37
          RESULT_DIR: browser-results/data/issue37

      - name: Verify configurable controls, corners, materials, opacity and social embeds
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:ui:issue39
        env:
          CAPTURE_DIR: browser-results/screenshots/issue39

      - name: Verify simple default turns, reported examples and 20 seeded networks
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue41
        env:
          CAPTURE_DIR: browser-results/screenshots/issue41
          RESULT_DIR: browser-results/data/issue41

      - name: Verify neutral geometry, network size transitions and random real networks
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network:issue43
        env:
          CAPTURE_DIR: browser-results/screenshots/issue43
          RESULT_DIR: browser-results/data/issue43

      - name: Verify the frame on every bordered element, the corner layer and the colour palettes
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:ui:issue45
        env:
          CAPTURE_DIR: browser-results/screenshots/issue45

      - name: Preserve browser evidence with bounded transport retries
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        uses: ./.github/actions/upload-artifact
        with:
          name: network-${{ matrix.engine }}
          path: browser-results/

  deploy:
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    needs: [prepare, test, tooling, docs, codeql]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.event_name != 'schedule' &&
      github.ref == 'refs/heads/main' && needs.prepare.outputs.code == 'true' &&
      needs.test.result == 'success' && needs.tooling.result == 'success' && needs.codeql.result == 'success' &&
      (needs.docs.result == 'success' || needs.prepare.outputs.docs == 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # A green deploy must mean the site is really there (issue #5).
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Verify the deployed site
        run: bash scripts/check-deployed-site.sh "$PAGE_URL"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}

  tooling:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-tooling
      cancel-in-progress: true
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify public source attribution and mirror deduplication
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/AlDanial/cloc/v2.10/cloc -o "$CLOC_PATH"
          printf '%s  %s\n' 'bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83' "$CLOC_PATH" | sha256sum --check
          python3 experiments/test_source_lines.py
        env:
          CLOC_PATH: ${{ runner.temp }}/cloc.pl
      - name: Install pinned source linters
        run: python -m pip install ruff==0.17.3 shellcheck-py==0.11.0.1
      - name: Check Python syntax, lint and formatting
        run: |
          python scripts/check-python.py
          ruff check .
          ruff format --check .
      - name: Check every standalone shell script and hook
        run: git ls-files -z '*.sh' '.husky/*' ':(exclude)dev/log/**' ':(exclude)docs/**' | xargs -0 shellcheck
      - name: Audit workflow security, including low-confidence credential findings
        uses: zizmorcore/zizmor-action@v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
          min-confidence: low
          config: .github/zizmor.yml
          inputs: .github/
      - name: Audit pedantic image pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pipx run zizmor==1.31.1 --config .github/zizmor.yml
          --persona pedantic --min-severity high --min-confidence high .github/

  docs:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-docs
      cancel-in-progress: true
    needs: [prepare, checks]
    if: needs.prepare.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check required documentation
        run: node scripts/check-docs.mjs
      - name: Restore link cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.sha }}
          restore-keys: lychee-${{ runner.os }}-
      - name: Check maintained documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  codeql:
    # Evidence-heavy PRs can exceed GitHub's 300-file compare API limit.
    # Run full analysis for every language instead of requesting a partial diff.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Setup Node.js for the security gate
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Reject unresolved security findings
        run: node scripts/check-codeql-results.mjs "$SARIF_DIR"
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-results

  pipeline-status:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    if: ${{ !cancelled() }}
    needs: [prepare, lint-workflows, checks, tooling, docs, codeql, network-browsers, test, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify every required outcome
        run: node scripts/check-pipeline-status.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.prepare.outputs.code }}
          DOCS_CHANGED: ${{ needs.prepare.outputs.docs }}
          SHOULD_DEPLOY: ${{ github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main' && needs.prepare.outputs.code == 'true' }}
